apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    kuadrant.io/gateway: "true"
    app.kubernetes.io/name: maas-gateway
  annotations:
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
    # The Route's host, which /v1/tenants reports as the external URL.
    # Replace with the host in openshift-route.yaml.
    maas.opendatahub.io/external-hostname: maas.<cluster-domain>
spec:
  gatewayClassName: openshift-default
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gw-options
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              maas.opendatahub.io/gateway-access: "true"
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            # Must match the serving-cert-secret-name in gw-options ConfigMap.
            # service-ca-operator populates this Secret automatically.
            name: maas-gw-service-tls
        mode: Terminate
