apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: embedding-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Embedding Access"
    openshift.io/description: "Grants all authenticated users access to the embedding model"
spec:
  modelRefs:
    - name: embedding-simulated
      namespace: llm
  subjects:
    groups:
      - name: system:authenticated
    users: []
