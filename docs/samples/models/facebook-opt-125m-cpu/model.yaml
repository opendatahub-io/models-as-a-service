apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: single-node-no-scheduler-cpu
spec:
  model:
    uri: hf://facebook/opt-125m
    # Distinct from the simulator samples (facebook/opt-125m) so both can run in
    # one namespace - body-based routing needs a unique model identity.
    name: facebook/opt-125m-cpu
  replicas: 1
  router:
    route: { }
    # Connect to MaaS-enabled gateway
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        # The image declares no USER. OpenShift assigns a non-root UID; elsewhere set
        # securityContext.runAsUser, or runAsNonRoot: false as KServe's own sample does.
        image: docker.io/vllm/vllm-openai-cpu:v0.23.0
        env:
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          # KV cache size in GiB.
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "1"
        resources:
          limits:
            cpu: '2'
            memory: 10Gi
          requests:
            cpu: '100m'
            memory: 8Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
