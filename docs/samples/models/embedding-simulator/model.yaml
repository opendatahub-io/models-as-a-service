# Simulated embedding model for development and testing.
# Uses llm-d-inference-sim with --no-mm-encoder-only to serve the full
# OpenAI surface including /v1/embeddings.
#
# To deploy a real embedding model (e.g. BAAI/bge-m3), replace the container
# image and args with your model server configuration.
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: embedding-simulated
spec:
  model:
    uri: hf://placeholder/no-model
    name: baai/bge-m3
  storageInitializer:
    enabled: false
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: "ghcr.io/llm-d/llm-d-inference-sim:v0.8.2"
        imagePullPolicy: Always
        command: ["/app/llm-d-inference-sim"]
        args:
        - --port
        - "8000"
        - --model
        - baai/bge-m3
        - --mode
        - random
        - --no-mm-encoder-only
        - --ssl-certfile
        - /var/run/kserve/tls/tls.crt
        - --ssl-keyfile
        - /var/run/kserve/tls/tls.key
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: https
            scheme: HTTPS
