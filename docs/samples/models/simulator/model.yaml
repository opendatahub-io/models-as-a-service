apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: simulated
spec:
  model:
    # uri is required by the LLMIS schema but not used by llm-d-inference-sim.
    uri: hf://placeholder/no-model
    name: facebook/opt-125m
  # Skip storage-initializer; simulator generates responses without model weights.
  storageInitializer:
    enabled: false
  replicas: 1
  router: 
    route: {}
    # Connect to MaaS-enabled gateway
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      # llm-d-inference-sim: OpenAI-compatible HTTP on --port; /health + /ready for probes.
      # Image ENTRYPOINT is /app/llm-d-inference-sim (v0.8.x); args are appended to it.
      # storageInitializer.enabled=false skips HF model download; simulator needs no weights.
      # See: https://github.com/llm-d/llm-d-inference-sim
      #
      # Do not bump this to v0.9.0. facebook/opt-125m is a real HuggingFace
      # repo, and v0.9.0 routes real model ids through the HF tokenizer, whose
      # --mode random dataset init calls a render service on localhost:8082
      # that nothing here runs. The container then crash-loops with
      # "failed to initialize random dataset ... connection refused". v0.9.0
      # logs "Model is not a real HF model, using simulated tokenizer" for the
      # made-up ids the other simulators use, which is why only this one broke.
      - name: main
        image: "ghcr.io/llm-d/llm-d-inference-sim:v0.8.2"
        imagePullPolicy: Always
        command: ["/app/llm-d-inference-sim"]
        args:
        - --port
        - "8000"
        - --model
        - facebook/opt-125m
        - --mode
        - random
        # Keep full OpenAI surface (e.g. /v1/embeddings); do not use encoder-only mode.
        - --no-mm-encoder-only
        - --ssl-certfile
        - /var/run/kserve/tls/tls.crt
        - --ssl-keyfile
        - /var/run/kserve/tls/tls.key
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: https
            scheme: HTTPS
