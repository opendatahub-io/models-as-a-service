[tool.pytest.ini_options]
markers = [
    "worker_tenant: test requires explicitly provisioned per-worker MaaS state",
    "serial: cluster-wide mutations; excluded from parallel pass 1 (see prow two-phase pytest)",
    "slow: long-running test (may wait for token expiry)",
    "xdist_group(name): pytest-xdist group marker for parallel test groups",
    "readonly: read-only smoke and validation tests (no cluster mutations)",
    "api_keys: API key CRUD, auth enforcement, subscription binding",
    "models: /v1/models endpoint and gateway-scoped AuthPolicy",
    "security: negative security paths and namespace scoping",
    "mt_lifecycle: multi-tenant AITenant lifecycle and discovery",
    "tenant_isolation: cross-tenant auth, rate-limit, subscription, and discovery isolation on shared tenants",
    "tenant_inference: cross-gateway inference isolation on its own tenants",
    "tenant_ipp: per-tenant IPP stacks and routing isolation on its own tenants",
    "tenant_auto_resolve: MaaSModelRef tenant auto-resolution",
    "legacy_ipp: legacy maas-controller IPP dataplane; excluded from default e2e passes (run with -m legacy_ipp)",
    "external: external OIDC and ExternalModel integrations",
]
addopts = "--strict-markers"

[tool.ruff]
# Floor matches pytest 9 (Requires-Python >=3.10) and group-test / e2e-collect (3.11).
target-version = "py311"
