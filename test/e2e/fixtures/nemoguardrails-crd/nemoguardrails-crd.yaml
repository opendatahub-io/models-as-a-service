                          The main container opts in by referencing the entry's name in spec.resources.claims.
                          Changes update the Deployment's Pod template and trigger a rollout.
                        items:
                          description: |-
                            PodResourceClaim references exactly one ResourceClaim, either directly
                            or by naming a ResourceClaimTemplate which is then turned into a ResourceClaim
                            for the pod.

                            It adds a name to it that uniquely identifies the ResourceClaim inside the Pod.
                            Containers that need access to the ResourceClaim reference it with this name.
                          properties:
                            name:
                              description: |-
                                Name uniquely identifies this resource claim inside the pod.
                                This must be a DNS_LABEL.
                              type: string
                            resourceClaimName:
                              description: |-
                                ResourceClaimName is the name of a ResourceClaim object in the same
                                namespace as this pod.

                                Exactly one of ResourceClaimName and ResourceClaimTemplateName must
                                be set.
                              type: string
                            resourceClaimTemplateName:
                              description: |-
                                ResourceClaimTemplateName is the name of a ResourceClaimTemplate
                                object in the same namespace as this pod.

                                The template will be used to create a new ResourceClaim, which will
                                be bound to this pod. When this pod is deleted, the ResourceClaim
                                will also be deleted. The pod name and resource name, along with a
                                generated component, will be used to form a unique name for the
                                ResourceClaim, which will be recorded in pod.status.resourceClaimStatuses.

                                This field is immutable and no changes will be made to the
                                corresponding ResourceClaim by the control plane after creating the
                                ResourceClaim.

                                Exactly one of ResourceClaimName and ResourceClaimTemplateName must
                                be set.
                              type: string
                          required:
                          - name
                          type: object
                          x-kubernetes-validations:
                          - message: exactly one of resourceClaimName and resourceClaimTemplateName
                              must be set
                            rule: has(self.resourceClaimName) != has(self.resourceClaimTemplateName)
                          - message: resourceClaimName must not be empty
                            rule: '!has(self.resourceClaimName) || size(self.resourceClaimName)
                              > 0'
                          - message: resourceClaimTemplateName must not be empty
                            rule: '!has(self.resourceClaimTemplateName) || size(self.resourceClaimTemplateName)
                              > 0'
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      tolerations:
                        description: If specified, the pod's tolerations
                        items:
                          description: |-
                            The pod this Toleration is attached to tolerates any taint that matches
                            the triple <key,value,effect> using the matching operator <operator>.
                          properties:
                            effect:
                              description: |-
                                Effect indicates the taint effect to match. Empty means match all taint effects.
                                When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                              type: string
                            key:
                              description: |-
                                Key is the taint key that the toleration applies to. Empty means match all taint keys.
                                If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                              type: string
                            operator:
                              description: |-
                                Operator represents a key's relationship to the value.
                                Valid operators are Exists and Equal. Defaults to Equal.
                                Exists is equivalent to wildcard for value, so that a pod can
                                tolerate all taints of a particular category.
                              type: string
                            tolerationSeconds:
                              description: |-
                                TolerationSeconds represents the period of time the toleration (which must be
                                of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                                it is not set, which means tolerate the taint forever (do not evict). Zero and
                                negative values will be treated as 0 (evict immediately) by the system.
                              format: int64
                              type: integer
                            value:
                              description: |-
                                Value is the taint value the toleration matches to.
                                If the operator is Exists, the value should be empty, otherwise just a regular string.
                              type: string
                          type: object
                        type: array
