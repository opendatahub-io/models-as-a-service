# E2E Test Fixtures Kustomization
# Combines public samples (free, premium) with e2e-only test fixtures
# (unconfigured, distinct, distinct-2) for comprehensive testing.
# Use this for CI/e2e tests instead of the public samples kustomization.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Public samples (free + premium tiers)
  - ../../../docs/samples/maas-system/free
  - ../../../docs/samples/maas-system/premium
  # E2E-only test fixtures
  - unconfigured  # No auth/subscription (validates 403)
  - distinct      # Distinct model ID (validates multiple distinct models)
  - distinct-2    # Second distinct model ID (validates multiple distinct models)
  - trlp-test     # TRLP test model (validates TRLP validation behavior)
  - embedding     # Embedding model (validates /v1/embeddings, TRLP, default-deny)

# E2E-only: enable the simulator's optional full HTTP request/response logging so tests
# can assert on headers the backend actually received. Scoped to this e2e
# kustomization only. v0.8.2 (the version pinned in the public sample) predates --log-http;
# v0.9.0+ includes it.
#
# v0.9.0 also replaced the "UDS Tokenizer" with "vLLM Render" for any --model value that
# looks like a real HuggingFace repo id. Point --model at a dummy id to force the
# simulator's fast/simulated tokenizer (no render dependency) while --served-model-name keeps
# exposing the real id the rest of the e2e suite routes to.
patches:
  - target:
      group: serving.kserve.io
      version: v1alpha1
      kind: LLMInferenceService
      name: facebook-opt-125m-simulated
      namespace: llm
    patch: |-
      - op: replace
        path: /spec/template/containers/0/image
        value: ghcr.io/llm-d/llm-d-inference-sim:v0.9.0
      - op: replace
        path: /spec/template/containers/0/args
        value:
          - --port
          - "8000"
          - --model
          - simulated/does-not-exist-facebook-opt-125m
          - --served-model-name
          - facebook/opt-125m
          - --mode
          - random
          - --no-mm-encoder-only
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
          - --log-http
