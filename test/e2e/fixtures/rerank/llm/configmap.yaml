apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-rerank-mock-script
  namespace: llm
data:
  server.py: |
    import json
    import ssl
    from http.server import BaseHTTPRequestHandler, HTTPServer

    MODEL = "test/e2e-rerank-model"

    def route_response(path):
        if path.endswith("/v1/rerank"):
            return {"model": MODEL, "results": [{"index": 0, "relevance_score": 0.42}]}
        if path.endswith("/v1/ocr"):
            return {"model": MODEL, "text": "mock ocr"}
        if path.endswith("/v1/moderations"):
            return {"model": MODEL, "results": [{"flagged": False}]}
        if path.endswith("/v1/extraction"):
            return {"model": MODEL, "data": {}}
        if path.endswith("/v1/decisions"):
            return {"model": MODEL, "decision": "allow"}
        if path.endswith("/v1/responses"):
            return {"model": MODEL, "output": []}
        if path.endswith("/v1/images/generations"):
            return {"model": MODEL, "data": [{"url": "https://example.invalid/mock.png"}]}
        if path.endswith("/v1/audio/voices"):
            return {"model": MODEL, "voices": []}
        if path.endswith("/v1/search/query"):
            return {"model": MODEL, "results": []}
        return None

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            return

        def _send_json(self, code, body):
            raw = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def do_GET(self):
            if self.path.rstrip("/") in ("/health", "/ready"):
                self._send_json(200, {"status": "ok"})
                return
            self.send_response(404)
            self.end_headers()

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0) or 0)
            if length:
                self.rfile.read(length)
            body = route_response(self.path.split("?", 1)[0])
            if body is None:
                self.send_response(404)
                self.end_headers()
                return
            self._send_json(200, body)

    if __name__ == "__main__":
        httpd = HTTPServer(("0.0.0.0", 8000), Handler)
        ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
        ctx.load_cert_chain(
            "/var/run/kserve/tls/tls.crt", "/var/run/kserve/tls/tls.key"
        )
        httpd.socket = ctx.wrap_socket(httpd.socket, server_side=True)
        httpd.serve_forever()