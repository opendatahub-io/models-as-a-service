apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: e2e-slow-stream-simulated
  annotations:
    # Pacing exists only so a test can tell streaming from buffering. See
    # fixtures/README.md "slow-stream". Do not remove these flags to "speed up"
    # the suite: without them the simulator finishes generation before the first
    # read and every stream looks buffered.
    test.maas.opendatahub.io/purpose: "paced backend for streaming-delivery assertions"
spec:
  model:
    # uri is required by the LLMIS schema but not used by llm-d-inference-sim.
    uri: hf://placeholder/no-model
    name: test/e2e-slow-stream-model
  # Skip storage-initializer; simulator generates responses without model weights.
  storageInitializer:
    enabled: false
  replicas: 1
  router:
    route: {}
    # Connect to MaaS-enabled gateway
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: "ghcr.io/llm-d/llm-d-inference-sim:v0.8.2"
        imagePullPolicy: Always
        command: ["/app/llm-d-inference-sim"]
        args:
        - --port
        - "8000"
        - --model
        - test/e2e-slow-stream-model
        - --mode
        # echo, not random: random mode stops at a random token count, so the
        # number of chunks -- and therefore any absolute delivery-time window --
        # varies per request. Echo mirrors the (fixed) prompt, which makes the
        # chunk count deterministic.
        - echo
        - --no-mm-encoder-only
        - --ssl-certfile
        - /var/run/kserve/tls/tls.crt
        - --ssl-keyfile
        - /var/run/kserve/tls/tls.key
        # 2s before the first token, then one token every 100ms. The test sends a
        # fixed 20-word prompt, so the echo is delivered over ~1.9s of paced
        # generation: long enough that a buffering proxy is unmistakable.
        - --time-to-first-token
        - 2000ms
        - --inter-token-latency
        - 100ms
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: https
            scheme: HTTPS
