# Metrics Service for SecureServing.
# OpenShift service-ca provisions maas-controller-metrics-tls from the annotation.
apiVersion: v1
kind: Service
metadata:
  name: maas-controller-metrics
  namespace: opendatahub
  labels:
    control-plane: maas-controller
    app: maas-controller
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: maas-controller-metrics-tls
spec:
  ports:
    - name: metrics
      port: 8443
      protocol: TCP
      targetPort: metrics
  selector:
    control-plane: maas-controller
