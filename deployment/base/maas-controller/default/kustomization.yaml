apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../crd
  - ../rbac
  - ../manager
  - ../monitoring
  - ../webhook
  # Gateway policies (gateway-default-auth, gateway-default-deny) are applied
  # separately by deploy.sh so they stay in openshift-ingress; see deploy_via_kustomize.

# Derive ServiceMonitor tlsConfig.serverName as <service-name>.<namespace>.svc
replacements:
  - source:
      kind: Service
      name: maas-controller-metrics
      fieldPath: metadata.name
    targets:
      - select:
          kind: ServiceMonitor
          name: maas-controller-metrics
        fieldPaths:
          - spec.endpoints.0.tlsConfig.serverName
        options:
          delimiter: "."
          index: 0
  - source:
      kind: Service
      name: maas-controller-metrics
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ServiceMonitor
          name: maas-controller-metrics
        fieldPaths:
          - spec.endpoints.0.tlsConfig.serverName
        options:
          delimiter: "."
          index: 1
