# Supplemental permissions for the tenant reconciler to apply the scraper
# token Secret and the scraper ClusterRole without an RBAC escalation error.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maas-controller-metrics-credential
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
