# Supplemental permissions for the tenant reconciler to apply the scraper
# token Secret in the runtime-selected infrastructure namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maas-controller-metrics-credential
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Patch is limited to the token Secret. Kubernetes RBAC cannot constrain
  # create by resourceNames; the namespace is selected at runtime.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["maas-metrics-scraper-token"]
    verbs: ["patch"]
