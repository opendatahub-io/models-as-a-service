groups:
  - name: maas.authorino.auth-decisions
    rules:
      - record: maas:auth_decisions:rate5m
        expr: |
          sum by (authconfig, namespace, status) (
            rate(auth_server_authconfig_response_status{namespace=~"rh-connectivity-link|kuadrant-system"}[5m])
          )

      - record: maas:auth_deny_ratio:rate5m
        expr: |
          (
            (
              sum by (authconfig, namespace) (
                rate(auth_server_authconfig_response_status{namespace=~"rh-connectivity-link|kuadrant-system",status!="OK"}[5m])
              )
              or
              0 * group by (authconfig, namespace) (
                auth_server_authconfig_response_status{namespace=~"rh-connectivity-link|kuadrant-system"}
              )
            )
            /
            sum by (authconfig, namespace) (
              rate(auth_server_authconfig_response_status{namespace=~"rh-connectivity-link|kuadrant-system"}[5m])
            )
          )

      - record: maas:auth_latency_p95:5m
        expr: |
          histogram_quantile(0.95,
            sum by (authconfig, namespace, le) (
              rate(auth_server_authconfig_duration_seconds_bucket{namespace=~"rh-connectivity-link|kuadrant-system"}[5m])
            )
          )

      - alert: MaaSHighAuthDenyRate
        annotations:
          summary: High auth denial rate for an Authorino AuthConfig
          description: >-
            More than 10% of auth decisions for AuthConfig {{ $labels.authconfig }}
            in namespace {{ $labels.namespace }} have been denied over the last 10 minutes.
            Investigate AuthPolicy configuration, credential validity, and Authorino logs.
        expr: |
          maas:auth_deny_ratio:rate5m{namespace=~"rh-connectivity-link|kuadrant-system"} > 0.1
          and
          sum by (authconfig, namespace) (
            rate(auth_server_authconfig_response_status{namespace=~"rh-connectivity-link|kuadrant-system"}[5m])
          ) > 0.001
        for: 10m
        labels:
          severity: warning
