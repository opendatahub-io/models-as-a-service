apiVersion: extensions.kuadrant.io/v1alpha1
kind: TelemetryPolicy
metadata:
  name: maas-telemetry
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: maas-observability
spec:
  metrics:
    default:
      labels:
        model: responseBodyJSON("/model")
        user: auth.identity.userid
        # Subscription metadata for usage attribution and billing
        subscription: auth.identity.selected_subscription
        organization_id: 'has(auth.identity.subscription_info.organizationId) && auth.identity.subscription_info.organizationId != null ? auth.identity.subscription_info.organizationId : ""'
        cost_center: 'has(auth.identity.subscription_info.costCenter) && auth.identity.subscription_info.costCenter != null ? auth.identity.subscription_info.costCenter : ""'
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway