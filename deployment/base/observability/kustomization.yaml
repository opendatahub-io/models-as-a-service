apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# NOTE: limitador-servicemonitor.yaml (Limitador) is NOT included here.
# When Kuadrant CR has spec.observability.enable=true, the operator creates its own
# PodMonitor (kuadrant-limitador-monitor). Deploying our ServiceMonitor would cause
# duplicate metrics. The install-observability.sh script conditionally deploys it
# only when Kuadrant observability is disabled.
#
# NOTE: authorino-server-metrics-servicemonitor.yaml is deployed by maas-controller
# into the DSCI monitoring namespace, gated on Config.spec.authorinoMonitoring.
#
# NOTE: istio-gateway-service.yaml and istio-gateway-servicemonitor.yaml are NOT
# included here. They are applied conditionally by install-observability.sh only
# when the gateway deployment exists.
#
# NOTE: Authorino PrometheusRules are applied by maas-controller in the DSCI
# monitoring namespace, using monitoring.rhobs/v1 and OTEL-normalized metric names.
- gateway-telemetry-policy.yaml
- istio-gateway-telemetry.yaml

labels:
- pairs:
    app.kubernetes.io/part-of: maas-observability
    app.kubernetes.io/managed-by: maas-observability
