apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-discovery
  namespace: ai-tenants
rules:
- apiGroups: ["maas.opendatahub.io"]
  resources: ["aitenants"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-discovery
  namespace: ai-tenants
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-discovery
subjects:
- kind: ServiceAccount
  name: maas-discovery
  namespace: maas-discovery
