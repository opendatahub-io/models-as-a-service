apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-discovery
  namespace: openshift-ingress
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-discovery
  namespace: openshift-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-discovery
subjects:
- kind: ServiceAccount
  name: maas-discovery
  namespace: maas-discovery
