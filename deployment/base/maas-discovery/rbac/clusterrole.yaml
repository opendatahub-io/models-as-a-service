apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maas-discovery
rules:
# OpenShift cluster TLS security profile
- apiGroups: ["config.openshift.io"]
  resources: ["apiservers"]
  verbs: ["get", "list", "watch"]
# Tenant visibility entitlement inputs (cluster-wide reads)
- apiGroups: ["maas.opendatahub.io"]
  resources: ["maasauthpolicies", "maassubscriptions"]
  verbs: ["get", "list", "watch"]
# Token validation for caller authentication
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
# SAR check to verify caller is system:authenticated
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
