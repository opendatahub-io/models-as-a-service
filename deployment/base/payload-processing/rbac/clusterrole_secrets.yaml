apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: payload-processing-secrets-reader
rules:
  # apikey-injection plugin: reads provider credential secrets referenced by ExternalModel CRs.
  # Bound per-namespace via operator-rbac-toolkit scoper (not cluster-wide).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
