apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
  namespace: openshift-ingress
  # Do NOT set opendatahub.io/managed=false here: PostRender drops any resource that
  # already carries that annotation, which would prevent first-time creation.
  # The tenant reconciler stamps managed=false after bootstrap/migrate so later
  # SSA leaves this ConfigMap alone (see ApplyRendered). Set managed=true on the
  # live ConfigMap to opt back into continuous reconciler management.
data:
  custom-pre-processing-ipp-config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: PayloadProcessorConfig
    plugins:
    - type: body-field-to-header
      name: model-extractor
      parameters:
        fieldName: model
        headerName: X-Gateway-Model-Name
    - type: model-provider-resolver
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: model-extractor
        - pluginRef: model-provider-resolver
  custom-ipp-config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: PayloadProcessorConfig
    plugins:
    - type: maas-headers-guard
      name: maas-headers-guard
    - type: stream-usage-enforcer
    - type: model-provider-resolver
    - type: api-translation
    - type: apikey-injection
    - type: passthrough-profile-picker
      name: passthrough-profile-picker
    preProcessing:
      plugins:
      - pluginRef: maas-headers-guard
      - pluginRef: stream-usage-enforcer
      - pluginRef: model-provider-resolver
    profilePicker:
      pluginRef: passthrough-profile-picker
    profiles:
    - name: translation
      plugins:
        request:
        - pluginRef: api-translation
        - pluginRef: apikey-injection
        response:
        - pluginRef: api-translation
    - name: passthrough
      plugins:
        request:
        - pluginRef: apikey-injection
