apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
  namespace: openshift-ingress
  # Operators may set opendatahub.io/managed=false on the live ConfigMap to opt
  # out of reconciler SSA. Do not put that annotation in this source YAML:
  # PostRender drops resources that already carry it, which would prevent
  # first-time creation.
data:
  custom-pre-processing-ipp-config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: PayloadProcessorConfig
    plugins:
    - type: body-field-to-header
      name: model-extractor
      parameters:
        fieldName: model
        headerName: X-Gateway-Model-Name
    - type: model-provider-resolver
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: model-extractor
        - pluginRef: model-provider-resolver
  custom-ipp-config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: PayloadProcessorConfig
    plugins:
    - type: maas-headers-guard
      name: maas-headers-guard
    - type: stream-usage-enforcer
    - type: model-provider-resolver
    - type: api-translation
    - type: apikey-injection
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: maas-headers-guard
        - pluginRef: stream-usage-enforcer
        - pluginRef: model-provider-resolver
        - pluginRef: api-translation
        - pluginRef: apikey-injection
        # Response api-translation is off by default so SSE streaming for
        # internal/OpenAI-compatible models is not held by a response processor.
        # Re-enable for providers that need response rewrite (e.g. Anthropic):
        #   response:
        #   - pluginRef: api-translation
        # See docs/content/install/external-model-setup.md (IPP response translation).
        response: []
