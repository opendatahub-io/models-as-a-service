apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: payload-processing
  namespace: openshift-ingress
spec:
  # Must run AFTER Kuadrant's EnvoyFilter (default priority 0), which INSERT_BEFOREs
  # envoy.filters.http.wasm relative to the router. Without a positive priority, istiod
  # applies this resource first (same priority 0, older creationTimestamp) and the RHCL
  # wasm anchors miss — ext_proc never enters the gateway filter chain (404 NR on
  # body-routed /v1/*). Multi-tenant gateways are especially affected: their
  # payload-processing-* EFs are often created before Kuadrant's per-gateway EF.
  # ODH WasmPlugin anchors are unaffected: WasmPlugin is in the base chain before
  # any EnvoyFilter patches.
  # See: https://istio.io/latest/docs/reference/config/networking/envoy-filter/#EnvoyFilter
  priority: 10
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: maas-default-gateway
  configPatches:
    # Stage 1: must run BEFORE the WasmPlugin so auth sees X-Gateway-Model-Name, and before
    # Istio's InferencePool filter, which the last two patches move in front of the router.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: extensions.istio.io/wasmplugin/openshift-ingress.kuadrant-maas-default-gateway
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ext_proc.ipp-pre
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            failure_mode_allow: true
            allow_mode_override: true
            processing_mode:
              request_header_mode: "SEND"
              response_header_mode: "SKIP"
              request_body_mode: "FULL_DUPLEX_STREAMED"
              response_body_mode: "NONE"
              request_trailer_mode: "SEND"
            grpc_service:
              envoy_grpc:
                cluster_name: outbound|9004||payload-pre-processing.openshift-ingress.svc.cluster.local
              timeout: 300s
            message_timeout: 300s
    # Stage 2: must run AFTER the WasmPlugin (needs auth to have completed).
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: extensions.istio.io/wasmplugin/openshift-ingress.kuadrant-maas-default-gateway
      patch:
        operation: INSERT_AFTER
        value:
          name: envoy.filters.http.ext_proc.ipp
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            failure_mode_allow: false
            allow_mode_override: true
            processing_mode:
              request_header_mode: "SEND"
              response_header_mode: "SEND"
              request_body_mode: "FULL_DUPLEX_STREAMED"
              response_body_mode: "FULL_DUPLEX_STREAMED"
              request_trailer_mode: "SEND"
              response_trailer_mode: "SEND"
            grpc_service:
              envoy_grpc:
                cluster_name: outbound|9004||payload-processing.openshift-ingress.svc.cluster.local
              timeout: 300s
            message_timeout: 300s
    # RHCL 1.4 injects auth via envoy.filters.http.wasm (no WasmPlugin CR). Only one anchor
    # pair matches per cluster: WasmPlugin on ODH/community Kuadrant, wasm filter on RHCL 1.4.
    # These patches require priority > Kuadrant's EF (see spec.priority above).
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: envoy.filters.http.wasm
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ext_proc.ipp-pre
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            failure_mode_allow: true
            allow_mode_override: true
            processing_mode:
              request_header_mode: "SEND"
              response_header_mode: "SKIP"
              request_body_mode: "FULL_DUPLEX_STREAMED"
              response_body_mode: "NONE"
              request_trailer_mode: "SEND"
            grpc_service:
              envoy_grpc:
                cluster_name: outbound|9004||payload-pre-processing.openshift-ingress.svc.cluster.local
              timeout: 300s
            message_timeout: 300s
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: envoy.filters.http.wasm
      patch:
        operation: INSERT_AFTER
        value:
          name: envoy.filters.http.ext_proc.ipp
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            failure_mode_allow: false
            allow_mode_override: true
            processing_mode:
              request_header_mode: "SEND"
              response_header_mode: "SEND"
              request_body_mode: "FULL_DUPLEX_STREAMED"
              response_body_mode: "FULL_DUPLEX_STREAMED"
              request_trailer_mode: "SEND"
              response_trailer_mode: "SEND"
            grpc_service:
              envoy_grpc:
                cluster_name: outbound|9004||payload-processing.openshift-ingress.svc.cluster.local
              timeout: 300s
            message_timeout: 300s
    # Fallback when Kuadrant WASM is absent (dev repair, failed rollout, or future auth
    # architecture): anchor ext_proc on the stable router filter so inference traffic
    # still reaches payload-processing. Order: ipp-pre → ipp → router.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ext_proc.ipp-pre
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            failure_mode_allow: true
            allow_mode_override: true
            processing_mode:
              request_header_mode: "SEND"
              response_header_mode: "SKIP"
              request_body_mode: "FULL_DUPLEX_STREAMED"
              response_body_mode: "NONE"
              request_trailer_mode: "SEND"
            grpc_service:
              envoy_grpc:
                cluster_name: outbound|9004||payload-pre-processing.openshift-ingress.svc.cluster.local
              timeout: 300s
            message_timeout: 300s
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ext_proc.ipp
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            failure_mode_allow: false
            allow_mode_override: true
            processing_mode:
              request_header_mode: "SEND"
              response_header_mode: "SEND"
              request_body_mode: "FULL_DUPLEX_STREAMED"
              response_body_mode: "FULL_DUPLEX_STREAMED"
              request_trailer_mode: "SEND"
              response_trailer_mode: "SEND"
            grpc_service:
              envoy_grpc:
                cluster_name: outbound|9004||payload-processing.openshift-ingress.svc.cluster.local
              timeout: 300s
            message_timeout: 300s
    # Disable ext_proc on all non-inference maas-api routes.
    # Route name follows Istio's Gateway API naming: <namespace>.<httproute-name>.<rule-index>
    # Rule indices correspond to httproute.yaml rules:
    #   0 = /v1/models, 1 = /v1/subscriptions, 2 = /v1/api-keys, 3 = /maas-api/v1/*, 4 = /maas-api/health
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            route:
              name: "PLACEHOLDER.maas-api-route.0"
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_proc.ipp-pre:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              disabled: true
            envoy.filters.http.ext_proc.ipp:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              disabled: true
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            route:
              name: "PLACEHOLDER.maas-api-route.1"
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_proc.ipp-pre:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              disabled: true
            envoy.filters.http.ext_proc.ipp:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              disabled: true
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            route:
              name: "PLACEHOLDER.maas-api-route.2"
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_proc.ipp-pre:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              disabled: true
            envoy.filters.http.ext_proc.ipp:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              disabled: true
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            route:
              name: "PLACEHOLDER.maas-api-route.3"
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_proc.ipp-pre:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              disabled: true
            envoy.filters.http.ext_proc.ipp:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              disabled: true
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            route:
              name: "PLACEHOLDER.maas-api-route.4"
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_proc.ipp-pre:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              disabled: true
            envoy.filters.http.ext_proc.ipp:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
              disabled: true
    # Move Istio's InferencePool filter (envoy.filters.http.ext_proc) in front of the router,
    # giving ipp-pre -> auth -> ipp -> EPP -> router. The filter binds the EPP once, from the
    # route matched in its own decodeHeaders, and KServe pool routes match on
    # X-Gateway-Model-Name. Istio places it after the WasmPlugin phases, which is ahead of
    # ipp-pre with RHCL's router-anchored wasm filter and with the router fallback: the EPP
    # never runs and pool traffic silently falls back to round-robin. Moving ipp-pre ahead of
    # it instead runs the EPP before auth and, with a TokenRateLimitPolicy, empties
    # non-streaming responses on proxies without envoyproxy/envoy#45355.
    # Must stay after the stage 2 inserts (patches apply in list order), REMOVE first. The
    # REMOVE matches by name on every listener, so MaaS owns envoy.filters.http.ext_proc on
    # its gateways; anchoring on the router rather than ipp re-inserts it on each of them,
    # whichever auth anchor matched. The value copies the static filter Istio renders
    # (pilot/pkg/xds/filters, unchanged from OSSM 1.26 through Istio 1.29) and replaces
    # Istio's own, so an Istio change to it needs a matching change here. The per-route
    # ExtProcPerRoute override is keyed on this exact name, and envoy.lb metadata carries the
    # endpoint the EPP picked. On a gateway without an InferencePool the REMOVE matches
    # nothing and the inserted copy stays inert (header modes SKIP, no per-route override).
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: envoy.filters.http.ext_proc
      patch:
        operation: REMOVE
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ext_proc
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            grpc_service:
              envoy_grpc:
                cluster_name: dummy
              timeout: 10s
            failure_mode_allow: true
            # Listener-level default only: Istio's ExtProcPerRoute override on every InferencePool
            # route sends headers and bodies (FULL_DUPLEX_STREAMED) to that pool's EPP
            # (pilot/pkg/networking/core/route/route.go).
            processing_mode:
              request_header_mode: "SKIP"
              response_header_mode: "SKIP"
            message_timeout: 1000s
            metadata_options:
              forwarding_namespaces:
                untyped:
                  - envoy.lb
              receiving_namespaces:
                untyped:
                  - envoy.lb
