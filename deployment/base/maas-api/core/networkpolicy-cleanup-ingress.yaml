apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maas-api-allow-cleanup
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: maas-api
      app.kubernetes.io/component: api
      app.kubernetes.io/part-of: models-as-a-service
  policyTypes:
  - Ingress
  ingress:
  # Allow the maas-controller to call the internal tenant API-key revocation
  # endpoint in-process when an AITenant is deleted. The controller runs in its
  # own namespace, so match by pod label across all namespaces.
  - from:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app: maas-controller
    ports:
    - protocol: TCP
      port: 8443
