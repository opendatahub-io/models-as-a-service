apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maas-api

resources:
  - ../core
  - ../rbac
  - ../networking
  - ../policies
  - ../monitoring

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: models-as-a-service
      app.kubernetes.io/component: api
      app.kubernetes.io/name: maas-api

# Derive ServiceMonitor tlsConfig.serverName as <service-name>.<namespace>.svc
replacements:
  - source:
      kind: Service
      name: maas-api-metrics
      fieldPath: metadata.name
    targets:
      - select:
          kind: ServiceMonitor
          name: maas-api-metrics
        fieldPaths:
          - spec.endpoints.0.tlsConfig.serverName
        options:
          delimiter: "."
          index: 0
  - source:
      kind: Service
      name: maas-api-metrics
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ServiceMonitor
          name: maas-api-metrics
        fieldPaths:
          - spec.endpoints.0.tlsConfig.serverName
        options:
          delimiter: "."
          index: 1
