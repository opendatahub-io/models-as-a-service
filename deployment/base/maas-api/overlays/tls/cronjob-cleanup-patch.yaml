# CronJob base uses http://maas-api:8080; TLS overlay exposes HTTPS on 8443 only.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maas-api-key-cleanup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
          - name: maas-api-service-ca
            configMap:
              name: openshift-service-ca.crt
          containers:
          - name: cleanup
            volumeMounts:
            - name: maas-api-service-ca
              mountPath: /etc/pki/maas-api
              readOnly: true
            command:
            - /bin/sh
            - -c
            - |
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" && \
              curl -sf --cacert /etc/pki/maas-api/service-ca.crt -X POST -H "Authorization: Bearer ${TOKEN}" https://maas-api:8443/internal/v1/api-keys/cleanup
