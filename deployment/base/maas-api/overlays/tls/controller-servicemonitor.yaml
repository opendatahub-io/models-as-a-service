# Kept beside the credential Secret in the MaaS application namespace. The
# controller Service itself remains in the controller namespace.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: maas-controller-metrics
  namespace: maas-api
  labels:
    app: maas-controller
    monitoring.opendatahub.io/scrape: "true"
spec:
  namespaceSelector:
    matchNames:
      - opendatahub
  selector:
    matchLabels:
      control-plane: maas-controller
      app: maas-controller
  endpoints:
    - path: /metrics
      port: metrics
      scheme: https
      interval: 30s
      authorization:
        type: Bearer
        credentials:
          name: maas-metrics-scraper-token
          key: token
      tlsConfig:
        ca:
          configMap:
            name: openshift-service-ca.crt
            key: service-ca.crt
        serverName: maas-controller-metrics.opendatahub.svc
