apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: maas-api-backend-tls
  namespace: openshift-ingress
spec:
  host: maas-api.maas-api.svc.cluster.local
  trafficPolicy:
    portLevelSettings:
    - port:
        number: 8443
      tls:
        mode: SIMPLE
        # TODO(RHOAIENG-61070): Remove insecureSkipVerify and configure backend
        # certificate validation. On xKS the cert-manager CA that signs
        # maas-api's serving cert is not available to the managed gateway proxy.
        # Distributing the CA to Istio gateway pods requires cluster-level Istio
        # configuration (credentialName or volume mount) outside this overlay's
        # scope. Traffic is still encrypted.
        insecureSkipVerify: true
