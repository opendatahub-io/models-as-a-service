# CronJob base uses http://maas-api:8080; TLS overlay serves HTTPS on 8443 only.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maas-api-key-cleanup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cleanup
            command:
            - /bin/sh
            - -c
            - |
              curl -sf --cacert /etc/maas-api-ca/ca.crt -X POST https://maas-api:8443/internal/v1/api-keys/cleanup
            volumeMounts:
            - name: maas-api-ca
              mountPath: /etc/maas-api-ca
              readOnly: true
          volumes:
          - name: maas-api-ca
            secret:
              secretName: maas-api-serving-cert
              items:
              - key: ca.crt
                path: ca.crt
