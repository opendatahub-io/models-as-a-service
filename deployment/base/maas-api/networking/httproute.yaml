apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maas-api-route
spec:
  parentRefs:
    - name: maas-default-gateway
      namespace: openshift-ingress
  # WARNING: Rule order matters — the payload-processing EnvoyFilter
  # (deployment/base/payload-processing/manager/envoy-filter.yaml) disables
  # ext_proc per-route using Istio's "<namespace>.<httproute-name>.<rule-index>"
  # naming convention. Adding, removing, or reordering rules here requires
  # updating the EnvoyFilter route indices to match.
  rules:
    # Rule 0: OpenAI-compatible /v1/models endpoint at top level
    # NOTE: Using PathPrefix /v1/models (not /v1) to exclude /v1/tenants which is internal-only
    - matches:
        - path:
            type: PathPrefix
            value: /v1/models
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    # Rule 1: /v1/subscriptions endpoint at top level
    - matches:
        - path:
            type: PathPrefix
            value: /v1/subscriptions
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    # Rule 2: /v1/api-keys endpoint at top level
    - matches:
        - path:
            type: PathPrefix
            value: /v1/api-keys
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    # Rules 3-8: Public maas-api endpoints under /maas-api/v1. Gateway API
    # permits ReplacePrefixMatch with exactly one PathPrefix match, so each
    # public prefix gets its own rule. The internal /v1/logs Loki proxy is
    # deliberately absent. /v1/tenants remains reachable because the handler
    # enforces TokenReview + SAR and returns only non-sensitive discovery
    # metadata.
    - matches:
        - path:
            type: PathPrefix
            value: /maas-api/v1/models
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1/models
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    - matches:
        - path:
            type: PathPrefix
            value: /maas-api/v1/subscriptions
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1/subscriptions
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    - matches:
        - path:
            type: PathPrefix
            value: /maas-api/v1/model
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1/model
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    - matches:
        - path:
            type: PathPrefix
            value: /maas-api/v1/api-keys
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1/api-keys
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    - matches:
        - path:
            type: PathPrefix
            value: /maas-api/v1/tenants
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1/tenants
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    - matches:
        - path:
            type: PathPrefix
            value: /maas-api/v1/me
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1/me
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    # Rule 9: Public process health only; the exact match keeps database
    # diagnostics cluster-internal.
    - matches:
        - path:
            type: Exact
            value: /maas-api/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /health
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    # Rule 10: Verified SSO identity endpoint at top level
    - matches:
        - path:
            type: Exact
            value: /v1/me
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
