apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maas-api-route
spec:
  parentRefs:
    - name: maas-default-gateway
      namespace: openshift-ingress
  # WARNING: Rule order matters — the payload-processing EnvoyFilter
  # (deployment/base/payload-processing/manager/envoy-filter.yaml) disables
  # ext_proc per-route using Istio's "<namespace>.<httproute-name>.<rule-index>"
  # naming convention. Adding, removing, or reordering rules here requires
  # updating the EnvoyFilter route indices to match.
  rules:
    # Rule 0: OpenAI-compatible /v1/models endpoint at top level
    # NOTE: Using PathPrefix /v1/models (not /v1) to exclude /v1/tenants which is internal-only
    - matches:
        - path:
            type: PathPrefix
            value: /v1/models
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    # Rule 1: /v1/subscriptions endpoint at top level
    - matches:
        - path:
            type: PathPrefix
            value: /v1/subscriptions
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    # Rule 2: /v1/api-keys endpoint at top level
    - matches:
        - path:
            type: PathPrefix
            value: /v1/api-keys
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    # Rule 3: Public maas-api endpoints under /maas-api/v1 prefix.
    # Scoped to /v1 to prevent gateway exposure of /internal/* endpoints (FIND-004).
    # /v1/tenants is reachable via this prefix; accepted because the handler
    # enforces its own auth (TokenReview + SAR) and returns only non-sensitive
    # discovery metadata. Will move to a dedicated discovery service.
    - matches:
        - path:
            type: PathPrefix
            value: /maas-api/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
    # Rule 4: Health endpoint for external readiness probes
    - matches:
        - path:
            type: PathPrefix
            value: /maas-api/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /health
      backendRefs:
        - name: maas-api
          port: 8443
          weight: 100
