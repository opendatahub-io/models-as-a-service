# Insecure metrics scrape (METRICS_SECURE=false in base/dev).
# overlays/tls patches scheme to https with tlsConfig and bearer token.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: maas-api-metrics
  labels:
    app.opendatahub.io/modelsasservice: "true"
    app.kubernetes.io/part-of: maas
    app.kubernetes.io/component: monitoring
    monitoring.opendatahub.io/scrape: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: maas-api
      maas.opendatahub.io/metrics: "true"
  endpoints:
    - path: /metrics
      port: https
      scheme: http
      interval: 30s
