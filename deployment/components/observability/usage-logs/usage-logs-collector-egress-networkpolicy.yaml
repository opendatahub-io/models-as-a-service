# Egress NetworkPolicy for the usage-logs OpenTelemetry Collector.
#
# Complements usage-logs-collector-allow-gateway (ingress). The collector
# exports logs to the platform Loki gateway (usage-gateway-http) over HTTPS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: usage-logs-collector-egress-restrict
  namespace: opendatahub
  labels:
    app.kubernetes.io/part-of: maas-observability
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/component: opentelemetry-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: usage-logs-collector
      app.kubernetes.io/component: opentelemetry-collector
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: usage-gateway-http
      ports:
        - protocol: TCP
          port: 8080
