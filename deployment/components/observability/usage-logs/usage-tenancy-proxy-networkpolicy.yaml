# NetworkPolicies for usage-logs-tenancy-proxy.
#
# The proxy receives OTLP-over-HTTP from the usage-logs collector and forwards
# rewritten queries to the platform Loki gateway (usage-gateway-http).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: usage-tenancy-proxy-allow-collector
  namespace: opendatahub
  labels:
    app.kubernetes.io/part-of: maas-observability
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/component: usage-tenancy-proxy
spec:
  podSelector:
    matchLabels:
      app: usage-tenancy-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: usage-logs-collector
              app.kubernetes.io/component: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: usage-tenancy-proxy-egress-restrict
  namespace: opendatahub
  labels:
    app.kubernetes.io/part-of: maas-observability
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/component: usage-tenancy-proxy
spec:
  podSelector:
    matchLabels:
      app: usage-tenancy-proxy
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: usage-gateway-http
      ports:
        - protocol: TCP
          port: 8080
