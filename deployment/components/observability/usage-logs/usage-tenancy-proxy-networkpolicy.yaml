# NetworkPolicies for usage-logs-tenancy-proxy.
#
# The proxy receives authenticated log queries (e.g. from Perses) and forwards
# rewritten queries to the platform Loki gateway (usage-gateway-http). TokenReview
# calls require Kubernetes API access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: usage-tenancy-proxy-allow-perses
  namespace: opendatahub
  labels:
    app.kubernetes.io/part-of: maas-observability
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/component: usage-tenancy-proxy
spec:
  podSelector:
    matchLabels:
      app: usage-tenancy-proxy
  policyTypes:
    - Ingress
  ingress:
    # Perses queries the tenancy proxy for user-scoped usage logs (dashboard-5).
    # The collector exports directly to usage-gateway-http and does not use the proxy.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: perses-operator
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: usage-tenancy-proxy-egress-restrict
  namespace: opendatahub
  labels:
    app.kubernetes.io/part-of: maas-observability
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/component: usage-tenancy-proxy
spec:
  podSelector:
    matchLabels:
      app: usage-tenancy-proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    # Kubernetes API (TokenReview for bearer-token auth). Port-only rule matches
    # maas-api-egress-restrict: OVN may evaluate against the Service VIP.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: usage-gateway-http
      ports:
        - protocol: TCP
          port: 8080
