apiVersion: v1
kind: ServiceAccount
metadata:
  name: usage-tenancy-proxy
  namespace: opendatahub
  labels:
    app: usage-tenancy-proxy
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/component: usage-tenancy-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: usage-tenancy-proxy
  labels:
    app: usage-tenancy-proxy
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/component: usage-tenancy-proxy
rules:
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - get
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - loki.grafana.com
  resources:
  - application
  resourceNames:
  - logs
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: usage-tenancy-proxy
  labels:
    app: usage-tenancy-proxy
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/component: usage-tenancy-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: usage-tenancy-proxy
subjects:
- kind: ServiceAccount
  name: usage-tenancy-proxy
  namespace: opendatahub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: usage-tenancy-proxy-scc-nonroot-v2
  namespace: opendatahub
  labels:
    app: usage-tenancy-proxy
    app.kubernetes.io/managed-by: maas-controller
    app.kubernetes.io/component: usage-tenancy-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
- kind: ServiceAccount
  name: usage-tenancy-proxy
  namespace: opendatahub
