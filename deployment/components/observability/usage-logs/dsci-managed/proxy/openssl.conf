# TLS group override for the usage-logs tenancy proxy.
#
# The Deployment sets OPENSSL_CONF to this file, so OpenSSL loads it instead
# of the image configuration. This file therefore includes the image
# configuration first (/etc/pki/tls/openssl.cnf on ubi9/python-312) and
# overrides only Groups. Providers, the algorithm section, and the active
# crypto policy stay in effect, including stricter FUTURE or FIPS cipher,
# protocol, and signature settings.
#
# The include must stay above [crypto_policy]. The image file assigns
# openssl_conf from its default section and points system_default at
# [crypto_policy]; a later Groups value in that same section replaces only
# that key. A Groups line before the include would be overwritten by the
# policy, and a private openssl_conf value would drop the image providers.
#
# Groups is set so the proxy negotiates the X25519MLKEM768 hybrid
# post-quantum key exchange while keeping classical groups as fallback for
# clients without ML-KEM support (older Go builds, kubelet probes). '/'
# places the hybrid group in its own tuple ahead of the classical groups.
# The server walks tuples in order, so it uses the hybrid group (sending
# HelloRetryRequest when the client supports it but offered no key share)
# before any classical group.
#
# The '*' prefixes mark the groups that send a key_share in outbound
# ClientHellos (TokenReview, Loki gateway): both ML-KEM and X25519 shares
# are sent so servers that lack ML-KEM complete the handshake without a
# HelloRetryRequest round trip. When no group is starred, only the first
# group in the list gets a share.
.include /etc/pki/tls/openssl.cnf

[crypto_policy]
Groups = ?*X25519MLKEM768/*X25519:secp256r1:X448:secp521r1:secp384r1:ffdhe2048:ffdhe3072:ffdhe4096:ffdhe6144:ffdhe8192
