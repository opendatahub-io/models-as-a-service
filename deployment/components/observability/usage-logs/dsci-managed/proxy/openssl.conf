# TLS policy for the usage-logs tenancy proxy.
#
# The Deployment sets OPENSSL_CONF to this file, replacing the RHEL crypto
# policy for the proxy process. It is a copy of the distro DEFAULT policy
# (/etc/crypto-policies/back-ends/opensslcnf.config) with one change: the
# Groups list, to negotiate the X25519MLKEM768 hybrid post-quantum key
# exchange (TLS 1.3 only) while keeping classical groups as fallback for
# clients without ML-KEM support (older Go builds, kubelet probes).
#
# The '*' prefixes mark the groups that send a key_share in outbound
# ClientHellos (TokenReview, Loki gateway): both ML-KEM and X25519 shares
# are sent so servers that lack ML-KEM complete the handshake without a
# HelloRetryRequest round trip. When no group is starred, only the first
# group in the list gets a share.
#
# Trade-off: the process no longer tracks crypto-policy updates shipped in
# the base image. When the image is rebased, diff this file against the new
# /etc/crypto-policies/back-ends/opensslcnf.config and resync the non-Groups
# lines.
openssl_conf = openssl_init

[openssl_init]
ssl_conf = ssl_sect

[ssl_sect]
system_default = system_default_sect

[system_default_sect]
CipherString = @SECLEVEL=2:kEECDH:kRSA:kEDH:kPSK:kDHEPSK:kECDHEPSK:kRSAPSK:-aDSS:-3DES:!DES:!RC4:!RC2:!IDEA:-SEED:!eNULL:!aNULL:!MD5:-SHA384:-CAMELLIA:-ARIA:-AESCCM8
Ciphersuites = TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:TLS_AES_128_CCM_SHA256
TLS.MinProtocol = TLSv1.2
TLS.MaxProtocol = TLSv1.3
DTLS.MinProtocol = DTLSv1.2
DTLS.MaxProtocol = DTLSv1.2
SignatureAlgorithms = ECDSA+SHA256:ECDSA+SHA384:ECDSA+SHA512:ed25519:ed448:rsa_pss_pss_sha256:rsa_pss_pss_sha384:rsa_pss_pss_sha512:rsa_pss_rsae_sha256:rsa_pss_rsae_sha384:rsa_pss_rsae_sha512:RSA+SHA256:RSA+SHA384:RSA+SHA512:ECDSA+SHA224:RSA+SHA224
Groups = *X25519MLKEM768:*X25519:secp256r1:X448:secp521r1:secp384r1:ffdhe2048:ffdhe3072:ffdhe4096:ffdhe6144:ffdhe8192
