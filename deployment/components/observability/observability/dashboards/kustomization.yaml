apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: maas-perses
  annotations:
    config.kubernetes.io/local-config: "true"

# The admin auth decisions dashboard is deliberately NOT listed here. This kustomization is
# rendered only when Config.spec.usageMetricsDashboard is true, and its resources are deleted
# when that gate is off. The auth decisions dashboard is a delivered platform feature, so it
# ships from ./auth-decisions/ and is applied unconditionally by
# LifecycleReconciler.ensureAuthDecisionsDashboard.
resources:
  - usage-dashboard.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: maas-observability
      app.kubernetes.io/component: perses
    includeSelectors: false
