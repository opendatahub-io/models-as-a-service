apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maas-consumer-portal-to-perses-ingress
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/part-of: maas-consumer-deploy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: perses-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: maas-default-gateway
      ports:
        - protocol: TCP
          port: 8080
