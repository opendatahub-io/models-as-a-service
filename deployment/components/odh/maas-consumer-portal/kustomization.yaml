apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This component spans the RHOAI applications and monitoring namespaces, so it
# intentionally has no namespace transformer. Apply it after the Dashboard,
# Perses, and maas-default-gateway are available.
resources:
  - maas-consumer-ui-httproute.yaml
  - maas-consumer-portal-to-perses-referencegrant.yaml
  - maas-consumer-portal-to-perses-networkpolicy.yaml
