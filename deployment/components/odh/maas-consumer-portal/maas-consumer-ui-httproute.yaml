apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maas-consumer-ui
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: maas-consumer-deploy
spec:
  # The Gateway listener owns hostname selection for each environment.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maas-default-gateway
      namespace: openshift-ingress
      sectionName: https
  rules:
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /maas-portal/perses/api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: ""
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-auth-request-preferred-username
              - x-auth-request-groups
              - x-auth-request-access-token
              - x-forwarded-user
              - x-forwarded-email
              - x-forwarded-groups
              - x-forwarded-preferred-username
              - x-maas-keyname
              - x-maas-subscription-rate-limit-id
      backendRefs:
        - group: ""
          kind: Service
          name: data-science-perses
          namespace: redhat-ods-monitoring
          port: 8080
          weight: 1
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /maas-portal/perses/proxy
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: ""
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-auth-request-preferred-username
              - x-auth-request-groups
              - x-auth-request-access-token
              - x-forwarded-user
              - x-forwarded-email
              - x-forwarded-groups
              - x-forwarded-preferred-username
              - x-maas-keyname
              - x-maas-subscription-rate-limit-id
      backendRefs:
        - group: ""
          kind: Service
          name: data-science-perses
          namespace: redhat-ods-monitoring
          port: 8080
          weight: 1
    - matches:
        - method: POST
          path:
            type: PathPrefix
            value: /maas-portal/perses/proxy
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: ""
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-auth-request-preferred-username
              - x-auth-request-groups
              - x-auth-request-access-token
              - x-forwarded-user
              - x-forwarded-email
              - x-forwarded-groups
              - x-forwarded-preferred-username
              - x-maas-keyname
              - x-maas-subscription-rate-limit-id
      backendRefs:
        - group: ""
          kind: Service
          name: data-science-perses
          namespace: redhat-ods-monitoring
          port: 8080
          weight: 1
    - matches:
        - path:
            type: Exact
            value: /maas-portal
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 302
            path:
              type: ReplaceFullPath
              replaceFullPath: /maas-portal/
    - matches:
        - path:
            type: PathPrefix
            value: /maas-portal
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-auth-request-preferred-username
              - x-auth-request-groups
              - x-auth-request-access-token
              - x-forwarded-user
              - x-forwarded-email
              - x-forwarded-groups
              - x-forwarded-preferred-username
              - x-maas-keyname
              - x-maas-subscription-rate-limit-id
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
      backendRefs:
        - group: ""
          kind: Service
          name: odh-dashboard-maas-ui
          port: 8243
          weight: 1
