apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maas-controller-metrics
spec:
  secretName: maas-controller-metrics-tls
  issuerRef:
    name: rhai-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - maas-controller-metrics.opendatahub.svc
    - maas-controller-metrics.opendatahub.svc.cluster.local
