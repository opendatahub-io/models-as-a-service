name: Actionlint

on:
  pull_request:
    paths:
      - '.github/actionlint.yaml'
      - '.github/workflows/**'
      - 'scripts/ci/tests/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  rerun-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test PR rerun parsing, authorization, and run selection
        run: python3 -m unittest discover -s scripts/ci/tests -v

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-actionlint@a0eab306d932827107b47f4c55b1dcceec210352 # v1.77.0
        with:
          fail_level: any
          # Whole tree, not just changed files, so an actionlint bump surfaces
          # new findings on its own PR instead of on the next unrelated one.
          filter_mode: nofilter
          reporter: github-pr-check
