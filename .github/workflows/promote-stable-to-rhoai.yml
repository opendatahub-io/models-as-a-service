# Merges stable into rhoai nightly and pushes the merge commit directly.

name: Promote Stable to RHOAI

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  promote:
    name: Promote stable to rhoai
    runs-on: ubuntu-latest
    permissions:
      contents: write

    concurrency:
      group: promote-stable-to-rhoai
      cancel-in-progress: false

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@7e473efe3cb98aa54f8d4bac15400b15fad77d94 # v2.2.0
        with:
          app-id: ${{ secrets.ODH_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.ODH_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "odh-release-bot[bot]"
          git config user.email "169063859+odh-release-bot[bot]@users.noreply.github.com"

      - name: Check for new commits
        id: check
        run: |
          git fetch origin stable rhoai

          DIFF_COUNT=$(git rev-list --count origin/rhoai..origin/stable)
          if [ "$DIFF_COUNT" -eq 0 ]; then
            echo "rhoai is already up to date with stable. Nothing to promote."
            echo "## ✅ Promote Stable to RHOAI" >> "$GITHUB_STEP_SUMMARY"
            echo "rhoai is already up to date with stable. No changes to merge." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $DIFF_COUNT commit(s) to promote from stable to rhoai."
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "diff_count=$DIFF_COUNT" >> "$GITHUB_OUTPUT"

      - name: Merge stable into rhoai
        if: steps.check.outputs.skip != 'true'
        env:
          DIFF_COUNT: ${{ steps.check.outputs.diff_count }}
        run: |
          git checkout rhoai
          git reset --hard origin/rhoai

          COMMIT_LOG=$(git log --oneline origin/rhoai..origin/stable --no-merges | head -50)

          MERGE_MSG="chore: promote stable to rhoai (${DIFF_COUNT} commits)"
          MERGE_MSG="${MERGE_MSG}"$'\n\n'"Commits included:"
          MERGE_MSG="${MERGE_MSG}"$'\n'"${COMMIT_LOG}"

          fail() {
            echo "::error title=Promotion failed::$1"
            echo "❌ $1"
            {
              echo "## ❌ Promote Stable to RHOAI — FAILED"
              echo ""
              echo "$1"
              echo ""
              echo "$2"
              echo '```'
              echo "$3"
              echo '```'
              echo ""
              echo "The rhoai branch was left untouched. Resolve manually, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          if ! git merge --no-ff origin/stable -m "$MERGE_MSG"; then
            CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)
            git merge --abort || true
            fail "Merge conflicts detected between stable and rhoai." \
                 "### Conflicted files" \
                 "$CONFLICTED_FILES"
          fi

          # a clean textual merge can still combine workflow changes from both
          # branches into something neither branch ever had; rhoai workflows must
          # match stable exactly after promotion
          WORKFLOW_DRIFT=$(git diff --name-only origin/stable HEAD -- .github/workflows/)
          if [ -n "$WORKFLOW_DRIFT" ]; then
            fail "rhoai has workflow changes that are not in stable." \
                 "### Workflows differing from stable" \
                 "$WORKFLOW_DRIFT"
          fi

          git push origin rhoai

          echo "✅ Merged ${DIFF_COUNT} commit(s) from stable into rhoai and pushed."

          {
            echo "## ✅ Promote Stable to RHOAI — SUCCESS"
            echo ""
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| Promotion | \`stable\` → \`rhoai\` |"
            echo "| Commits merged | **${DIFF_COUNT}** |"
            echo ""
            echo "### Commits included"
            echo '```'
            echo "$COMMIT_LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
