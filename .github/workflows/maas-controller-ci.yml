name: MaaS Controller

on:
  pull_request:
    paths:
      - 'maas-controller/**'
      - '.github/workflows/maas-controller-ci.yml'

permissions:
  actions: read
  contents: read

env:
  PROJECT_DIR: maas-controller

defaults:

  run:
    working-directory: maas-controller

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Align golangci-lint version with Makefile
        id: golangci-version
        run: |
          VERSION=$(grep '^GOLANGCI_LINT_VERSION' tools.mk | cut -d'=' -f2 | tr -d ' ?')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: maas-controller/go.mod
          cache: true
          cache-dependency-path: maas-controller/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.golangci-version.outputs.version }}
          working-directory: ${{ env.PROJECT_DIR }}

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: ${{ env.PROJECT_DIR }}/go.mod
          cache: true
          cache-dependency-path: ${{ env.PROJECT_DIR }}/go.sum

      - name: "Run govulncheck (non-blocking: GO-2026-5940 in kedacore/keda@v2.18.3 fixed in v2.20.0, blocked by controller-runtime pin)"
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./... || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: ${{ env.PROJECT_DIR }}/go.mod
          cache: true
          cache-dependency-path: ${{ env.PROJECT_DIR }}/go.sum

      - name: Run tests
        run: make test

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maas-controller-coverage
          path: |
            ${{ env.PROJECT_DIR }}/coverage.out
            ${{ env.PROJECT_DIR }}/coverage.html
          retention-days: 30
