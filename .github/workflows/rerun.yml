name: Re-Run PR Workflows

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  rerun:
    name: rerun
    if: >-
      github.event.issue.pull_request != '' &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/rerun-all') ||
       contains(github.event.comment.body, '/rerun-failed') ||
       contains(github.event.comment.body, '/rerun-workflow ')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'CONTRIBUTOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Rerun workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ID: ${{ github.event.comment.user.id }}
        run: |
          # Parse before making API calls; quoted mentions and command prefixes
          # must not accidentally rerun CI.
          COMMAND=$(printf '%s\n' "$COMMENT_BODY" | grep -m1 '^/rerun-' || true)
          # GitHub comments may use CRLF line endings.
          COMMAND=${COMMAND%$'\r'}
          TARGET_WORKFLOW=""
          case "$COMMAND" in
            /rerun-failed) MODE="--failed" ;;
            /rerun-all) MODE="" ;;
            /rerun-workflow\ *)
              MODE=""
              TARGET_WORKFLOW=${COMMAND#"/rerun-workflow "}
              TARGET_WORKFLOW=$(printf '%s' "$TARGET_WORKFLOW" | sed 's/[[:space:]]*$//; s/^"\(.*\)"$/\1/')
              if [ -z "$TARGET_WORKFLOW" ]; then
                echo "::error::Usage: /rerun-workflow <name>"
                exit 1
              fi
              ;;
            *)
              echo "::error::Expected /rerun-failed, /rerun-all, or /rerun-workflow <name> on its own line"
              exit 1
              ;;
          esac

          PR_HEAD=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" \
            --jq '[.head.sha, .head.repo.id, .head.ref, .base.repo.id] | @tsv')
          IFS=$'\t' read -r HEAD_SHA HEAD_REPOSITORY_ID HEAD_BRANCH BASE_REPOSITORY_ID <<< "$PR_HEAD"
          if [ -z "$HEAD_SHA" ] || [ -z "$HEAD_REPOSITORY_ID" ] || [ -z "$HEAD_BRANCH" ] || [ -z "$BASE_REPOSITORY_ID" ]; then
            echo "::error::Failed to resolve PR repositories, branch, and SHA for PR #${PR_NUMBER}"
            exit 1
          fi
          require_write_access() {
            if [ "${WRITE_AUTHORIZED:-false}" = true ]; then return; fi
            COMMENT_PERMISSION=$(gh api "repos/${GH_REPO}/collaborators/${COMMENT_AUTHOR}/permission")
            # Bind current permission to the original numeric identity: logins can change.
            # shellcheck disable=SC2016 # $user_id is a jq argument.
            WRITE_PERMISSION_FILTER='.user.id == $user_id and (.permission == "write" or .permission == "admin")'
            if ! jq -e --argjson user_id "$COMMENT_AUTHOR_ID" "$WRITE_PERMISSION_FILTER" \
                <<< "$COMMENT_PERMISSION" > /dev/null; then
              echo "::error::Retrying repository-owned branches or cancelled workflows requires current repository write access; ask a maintainer"
              exit 1
            fi
            WRITE_AUTHORIZED=true
          }
          # Public-fork pull_request runs retain GitHub's read-only token cap.
          # Same-repository runs can explicitly request write scopes and secrets;
          # do not delegate their replay on the basis of past contributions.
          if [ "$HEAD_REPOSITORY_ID" = "$BASE_REPOSITORY_ID" ]; then
            require_write_access
          fi
          echo "PR #${PR_NUMBER} HEAD SHA: ${HEAD_SHA}"

          FAILURES=0
          rerun_workflow() {
            local run_id=$1 mode=$2
            local name
            name=$(gh run view "$run_id" --json name -q .name)
            echo "Rerunning ${mode:-all} jobs in '${name}' (run ${run_id})..."
            # shellcheck disable=SC2086 # $mode must be unquoted: empty string should vanish, not pass ""
            if ! gh run rerun "$run_id" $mode; then
              echo "::warning::Failed to rerun ${run_id}"
              FAILURES=$((FAILURES + 1))
            fi
          }

          # Note: only covers pull_request runs. Workflows using pull_request_target
          # are excluded; only retry workflows that test the PR itself.
          # Select the newest logical run across all pages and statuses first.
          # A successful or active replacement makes older failures ineligible.
          # run_number stays fixed when an older run is retried; updated_at does not.
          # shellcheck disable=SC2016 # Variables are jq arguments, not shell expansions.
          RUN_FILTER='[.[].workflow_runs[]
              | select(.head_repository.id == $head_repo and .head_branch == $head_branch)]
            | group_by(.workflow_id)
            | map(max_by(.run_number))
            | .[]
            | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled"))
            | [.id, .conclusion]
            | @tsv'
          RUNS=$(gh api --paginate --slurp "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
            | jq -r --argjson head_repo "$HEAD_REPOSITORY_ID" --arg head_branch "$HEAD_BRANCH" "$RUN_FILTER")

          if [ -z "$RUNS" ]; then
            echo "No eligible failed or cancelled workflow runs found for PR #${PR_NUMBER} (SHA: ${HEAD_SHA})"
            exit 0
          fi

          echo "Found failed or cancelled runs: $(echo "$RUNS" | tr '\n' ' ')"

          RERUN_COUNT=0
          while IFS=$'\t' read -r RUN_ID RUN_CONCLUSION; do
            [ -n "$RUN_ID" ] || continue
            if [ -n "${TARGET_WORKFLOW:-}" ]; then
              WORKFLOW_NAME=$(gh run view "$RUN_ID" --json name -q .name)
              if [ "$WORKFLOW_NAME" != "$TARGET_WORKFLOW" ]; then
                echo "Skipping '${WORKFLOW_NAME}' (not '${TARGET_WORKFLOW}')"
                continue
              fi
            fi
            RERUN_MODE="$MODE"
            if [ "$RUN_CONCLUSION" = "cancelled" ]; then
              # A cancellation does not prove that GitHub's approval gate passed.
              # Keep this recovery path maintainer-only, including on fork PRs.
              require_write_access
              # --failed does not select cancelled jobs. Rerun the whole workflow
              # so cancelled prerequisites and their dependents run again.
              RERUN_MODE=""
              echo "Run ${RUN_ID} was cancelled; rerunning all jobs..."
            fi
            rerun_workflow "$RUN_ID" "$RERUN_MODE"
            RERUN_COUNT=$((RERUN_COUNT + 1))
          done <<< "$RUNS"

          if [ "$RERUN_COUNT" -eq 0 ] && [ -n "${TARGET_WORKFLOW:-}" ]; then
            echo "::error::No failed or cancelled workflow matching '${TARGET_WORKFLOW}' found"
            exit 1
          fi

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::${FAILURES} out of ${RERUN_COUNT} rerun(s) failed"
            exit 1
          fi
