name: Build

on:
  pull_request:
    paths:
      - 'maas-controller/api/**'
      - 'maas-controller/cmd/**'
      - 'maas-controller/pkg/**'
      - 'maas-controller/Makefile'
      - 'deployment/base/maas-controller/crd/**'
      - 'deployment/**'
      - '.github/workflows/build-test.yml'
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  validate-manifests:
    name: Validate Kustomize manifests
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-validate-manifests
      cancel-in-progress: true

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

    - name: Install kustomize
      uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0
      with:
        kustomize-version: '5.7.1'

    - name: Install promtool
      env:
        PROM_VERSION: '3.13.2'
      run: |
        curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
          | tar -xz --strip-components=1 -C "$RUNNER_TEMP" "prometheus-${PROM_VERSION}.linux-amd64/promtool"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Validate manifests and Prometheus rule tests
      run: |
        ./scripts/ci/validate-manifests.sh

  verify-codegen:
    name: Verify generated CRDs, RBAC, and deepcopy
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-verify-codegen
      cancel-in-progress: true

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
      with:
        go-version-file: maas-controller/go.mod
        cache: true
        cache-dependency-path: maas-controller/go.sum

    - name: Verify generated code is up to date
      working-directory: maas-controller
      run: make verify-codegen
