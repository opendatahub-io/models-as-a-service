version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/maas-controller"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      # The k8s ecosystem (apimachinery, client-go, controller-runtime,
      # structured-merge-diff, ...) must move as an aligned set; bumping one
      # library alone misaligns the module graph and fails to compile.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"

  - package-ecosystem: "gomod"
    directory: "/maas-api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      # The k8s ecosystem (apimachinery, client-go, controller-runtime,
      # structured-merge-diff, ...) must move as an aligned set; bumping one
      # library alone misaligns the module graph and fails to compile.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "area/ci"
    groups:
      actions:
        patterns:
          - "*"
