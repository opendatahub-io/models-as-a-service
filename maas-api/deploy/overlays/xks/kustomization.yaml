apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: maas-api-xks

# xKS overlay: uses cert-manager for TLS instead of OCP service-serving-certs.
# On xKS, cert-manager creates the serving cert and the cloud-manager injects the CA.
resources:
  - ../../../../deployment/base/maas-api/overlays/tls
  - ../../../../deployment/base/maas-controller/policies
  - ../../../../deployment/base/payload-processing/default
  - certificate.yaml

namespace: opendatahub

patches:
  # Replace OCP service-ca ConfigMap with an emptyDir (CA is injected by cert-manager
  # via the trust-manager or mounted from the cluster CA bundle)
  - target:
      kind: Deployment
      name: maas-api
    patch: |
      - op: replace
        path: /spec/template/spec/volumes/1
        value:
          name: openshift-service-ca
          secret:
            secretName: opendatahub-ca
            items:
              - key: tls.crt
                path: service-ca.crt
            optional: true

  # Remove OCP service-ca annotation (cert-manager handles cert creation)
  - target:
      kind: Service
      name: maas-api
    patch: |
      - op: remove
        path: /metadata/annotations/service.beta.openshift.io~1serving-cert-secret-name

  # Remove OCP CA bundle injection annotation from ConfigMap
  - target:
      kind: ConfigMap
      name: openshift-service-ca.crt
    patch: |
      - op: remove
        path: /metadata/annotations/service.beta.openshift.io~1inject-cabundle

  # Insecure metrics on xKS: no OpenShift service-ca, so drop the dedicated metrics
  # Service (and its maas-api-metrics-tls Secret) and ServiceMonitor scrape config.
  - target:
      kind: Service
      name: maas-api-metrics
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: maas-api-metrics

  # Exclude monitoring resources on xKS (ServiceMonitor references OCP service-ca ConfigMap;
  # NetworkPolicy references OCP-specific redhat-ods-monitoring namespace).
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: maas-api-metrics
    patch: |
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: maas-api-metrics
  - target:
      kind: NetworkPolicy
      name: maas-api-allow-monitoring
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: maas-api-allow-monitoring

  # overlays/tls enables secure metrics and requires maas-api-metrics-tls (service-ca).
  # cert-manager on xKS only provisions maas-api-serving-cert — disable secure metrics.
  - target:
      kind: Deployment
      name: maas-api
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: maas-api
      spec:
        template:
          spec:
            containers:
            - name: maas-api
              env:
              - name: METRICS_SECURE
                value: "false"
  # Make metrics-certs optional (index 2 after overlays/tls volume list).
  - target:
      kind: Deployment
      name: maas-api
    patch: |
      - op: replace
        path: /spec/template/spec/volumes/2/secret/optional
        value: true
