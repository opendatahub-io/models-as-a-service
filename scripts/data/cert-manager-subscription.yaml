---
# Namespace and OperatorGroup are created by ensure_operator_group() in deploy.sh,
# which skips creation when the namespace already has one. Declaring an
# OperatorGroup here would add a second one on clusters where cert-manager is
# already installed, putting the CSV into TooManyOperatorGroups/Failed.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-cert-manager-operator
  namespace: cert-manager-operator
spec:
  channel: stable-v1
  installPlanApproval: Automatic
  name: openshift-cert-manager-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
