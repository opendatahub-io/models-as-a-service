# Merge patch applied when EXTERNAL_OIDC=true (see configure_maas_api_authpolicy in deploy.sh).
#
# Authentication order (lower priority number = earlier block; Authorino tries the next
# block when the previous identity method does not validate the token):
# - api-keys: 0 (base auth-policy.yaml; Bearer sk-oai-* only)
# - oidc-identities: 1 — validate JWT against the external IdP (Keycloak) issuer first.
#   Keycloak access tokens succeed here; cluster/oc OAuth tokens fail issuer check and
#   fall through to openshift-identities.
# - openshift-identities: 2 — kubernetesTokenReview for OpenShift API server tokens.
#
# Do NOT put openshift before oidc: TokenReview runs first on every Bearer eyJ... token,
# fails for Keycloak JWTs, and some pipelines then never reach OIDC validation — E2E
# sees HTTP 401 on Keycloak-only flows.
#
# Authorization: oidc-client-bound must apply only to identities that came from OIDC
# (auth.identity.azp set). OpenShift TokenReview identities do not have azp; without
# this guard the rule still matched JWT-shaped Bearer tokens and denied with 403.
spec:
  rules:
    authentication:
      # API key authentication — must be preserved from the base policy.
      # Merge patch replaces the entire authentication block, so we must
      # re-declare api-keys here or it gets dropped.
      api-keys:
        when:
          - selector: request.headers.authorization
            operator: matches
            value: "^Bearer sk-oai-.*"
        plain:
          selector: request.headers.authorization
        priority: 0
      oidc-identities:
        when:
          - predicate: '!request.headers.authorization.startsWith("Bearer sk-oai-") && request.headers.authorization.matches("^Bearer [^.]+\\.[^.]+\\.[^.]+$")'
        jwt:
          issuerUrl: __OIDC_ISSUER_URL__
        priority: 1
      openshift-identities:
        when:
          - predicate: '!request.headers.authorization.startsWith("Bearer sk-oai-")'
        kubernetesTokenReview:
          audiences:
            - __CLUSTER_AUDIENCE__
            - maas-default-gateway-sa
        priority: 2
    metadata:
      # Preserve API key validation callback from the base policy.
      # Merge patch replaces the entire rules block; without this the
      # metadata section is dropped and API key requests get 500.
      apiKeyValidation:
        when:
          - selector: request.headers.authorization
            operator: matches
            value: "^Bearer sk-oai-.*"
        http:
          url: https://maas-api.__MAAS_NAMESPACE__.svc.cluster.local:8443/internal/v1/api-keys/validate
          method: POST
          contentType: application/json
          body:
            expression: '{"key": request.headers.authorization.replace("Bearer ", "")}'
        priority: 0
    authorization:
      oidc-client-bound:
        when:
          - predicate: '!request.headers.authorization.startsWith("Bearer sk-oai-") && request.headers.authorization.matches("^Bearer [^.]+\\.[^.]+\\.[^.]+$") && has(auth.identity.azp)'
        patternMatching:
          patterns:
            - selector: auth.identity.azp
              operator: eq
              value: __OIDC_CLIENT_ID__
        priority: 1
      oidc-groups-safe:
        when:
          - predicate: '!request.headers.authorization.startsWith("Bearer sk-oai-") && has(auth.identity.iss) && ("org_id" in auth.identity || (has(auth.identity.groups) && size(auth.identity.groups) > 0))'
        opa:
          rego: |
            unsafe_group["invalid_type"] {
              g := input.auth.identity.groups[_]
              not is_string(g)
            }

            unsafe_group[g] {
              org_id := input.auth.identity.org_id
              is_string(org_id)
              g := input.auth.identity.groups[_]
              is_string(g)
              g == ""
            }

            unsafe_group[g] {
              org_id := input.auth.identity.org_id
              is_string(org_id)
              g := input.auth.identity.groups[_]
              is_string(g)
              encoded := base64.encode(g)
              count(encoded) > 344
            }

            unsafe_group[g] {
              org_id := input.auth.identity.org_id
              is_string(org_id)
              g := input.auth.identity.groups[_]
              is_string(g)
              encoded := base64.encode(g)
              count(encoded) == 344
              not regex.match("==$", encoded)
            }

            unsafe_group[g] {
              g := input.auth.identity.groups[_]
              is_string(g)
              not input.auth.identity.org_id
              not regex.match("^[A-Za-z0-9:#._/ -]+$", g)
            }

            unsafe_group[g] {
              g := input.auth.identity.groups[_]
              is_string(g)
              not input.auth.identity.org_id
              regex.match("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/", g)
            }

            invalid_org_id {
              org_id := input.auth.identity.org_id
              not is_string(org_id)
            }

            invalid_org_id {
              org_id := input.auth.identity.org_id
              is_string(org_id)
              not regex.match("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", org_id)
            }

            invalid_group_list {
              object.keys(input.auth.identity)[_] == "groups"
              not is_array(input.auth.identity.groups)
            }

            invalid_group_list {
              groups := input.auth.identity.groups
              is_array(groups)
              count(groups) > 128
            }

            duplicate_group {
              org_id := input.auth.identity.org_id
              is_string(org_id)
              groups := input.auth.identity.groups
              is_array(groups)
              some i
              some j
              i < j
              groups[i] == groups[j]
            }

            allow {
              count(unsafe_group) == 0
              not invalid_org_id
              not invalid_group_list
              not duplicate_group
            }
      deny-client-identity-headers:
        metrics: false
        priority: 0
        patternMatching:
          patterns:
            - predicate: '!("x-maas-identity" in request.headers)'
            - predicate: '!("x-maas-exact-groups" in request.headers)'
    response:
      success:
        headers:
          # Three-way CEL expressions handle API keys, OIDC JWT, and OpenShift
          # TokenReview without any "when" clause. kubectl replace applies the
          # entire manifest so base policy fields are not inherited.
          X-MaaS-Username:
            plain:
              expression: >-
                (has(auth.metadata) && has(auth.metadata.apiKeyValidation)) ?
                auth.metadata.apiKeyValidation.username :
                (has(auth.identity.preferred_username) ?
                auth.identity.preferred_username :
                (has(auth.identity.sub) ? auth.identity.sub : auth.identity.user.username))
          X-MaaS-Group:
            plain:
              # Flat OIDC groups travel in X-MaaS-Identity.
              # Keep this header as a JSON array for legacy callers.
              expression: >-
                (has(auth.metadata) && has(auth.metadata.apiKeyValidation)) ?
                auth.metadata.apiKeyValidation.groupsJSON :
                (has(auth.identity.iss) && "org_id" in auth.identity ? '[]' :
                '["system:authenticated"' +
                (has(auth.identity.iss) ?
                ("org_id" in auth.identity ? [] :
                (has(auth.identity.groups) &&
                type(auth.identity.groups) == list &&
                auth.identity.groups.all(g, g.matches('^[A-Za-z0-9:#._/ -]+$') &&
                !g.matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/')) ?
                auth.identity.groups : [])) :
                (has(auth.identity.user) && has(auth.identity.user.groups) &&
                auth.identity.user.groups.all(g, g.matches('^[A-Za-z0-9:#._/ -]+$') &&
                !g.matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/')) ?
                auth.identity.user.groups : [])).map(g, ',"' + g + '"').join('') + ']')
          X-MaaS-Identity:
            when:
              - predicate: '!request.headers.authorization.startsWith("Bearer sk-oai-") && has(auth.identity.azp) && (request.path == "/v1/me" || request.path == "/maas-api/v1/me" || request.path == "/v1/subscriptions" || request.path.startsWith("/v1/subscriptions/") || request.path == "/v1/models" || request.path.startsWith("/v1/model/") && request.path.endsWith("/subscriptions") || request.path.startsWith("/v1/api-keys") || request.path.startsWith("/maas-api/v1/subscriptions") || request.path == "/maas-api/v1/models" || request.path.startsWith("/maas-api/v1/model/") && request.path.endsWith("/subscriptions") || request.path.startsWith("/maas-api/v1/api-keys"))'
            json:
              properties:
                source:
                  value: oidc
                claims:
                  expression: >-
                    "org_id" in auth.identity ?
                    {"iss": auth.identity.iss, "sub": auth.identity.sub, "aud": auth.identity.aud, "azp": auth.identity.azp,
                    "name": has(auth.identity.name) ? auth.identity.name : "",
                    "given_name": has(auth.identity.given_name) ? auth.identity.given_name : "",
                    "family_name": has(auth.identity.family_name) ? auth.identity.family_name : "",
                    "preferred_username": has(auth.identity.preferred_username) ? auth.identity.preferred_username : "",
                    "email": has(auth.identity.email) ? auth.identity.email : "",
                    "groups": has(auth.identity.groups) ? auth.identity.groups : [],
                    "org_id": auth.identity["org_id"],
                    "org_name": "org_name" in auth.identity ? auth.identity["org_name"] : "",
                    "roles": "roles" in auth.identity ? auth.identity["roles"] : []} :
                    {"iss": auth.identity.iss, "sub": auth.identity.sub, "aud": auth.identity.aud, "azp": auth.identity.azp,
                    "name": has(auth.identity.name) ? auth.identity.name : "",
                    "given_name": has(auth.identity.given_name) ? auth.identity.given_name : "",
                    "family_name": has(auth.identity.family_name) ? auth.identity.family_name : "",
                    "preferred_username": has(auth.identity.preferred_username) ? auth.identity.preferred_username : "",
                    "email": has(auth.identity.email) ? auth.identity.email : "",
                    "groups": has(auth.identity.groups) ? auth.identity.groups : []}
          X-MaaS-Subscription:
            when:
              - selector: request.headers.authorization
                operator: matches
                value: "^Bearer sk-oai-.*"
              - selector: auth.metadata.apiKeyValidation.subscription
                operator: neq
                value: ""
            plain:
              selector: auth.metadata.apiKeyValidation.subscription
            priority: 0
