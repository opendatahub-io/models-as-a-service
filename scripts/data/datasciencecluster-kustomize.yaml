---
# DataScienceCluster requirements for kustomize deployment mode (ODH/RHOAI 3.5+).
# In kustomize mode, MaaS components are deployed directly via manifests,
# NOT via the operator's aigateway.modelsAsAService controller. Enabling
# modelsAsAService in the DSC would cause server-side apply conflicts between
# the operator and kustomize manifests.
#
# KServe rawDeploymentServiceConfig: Headed is still required so model endpoints
# get ClusterIP services that the Gateway/HTTPRoutes can route traffic to.
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
spec:
  components:
    kserve:
      managementState: Managed
      rawDeploymentServiceConfig: Headed
    aigateway:
      managementState: Managed
      modelsAsAService:
        managementState: Removed
